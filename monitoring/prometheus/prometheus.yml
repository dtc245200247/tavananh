global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Backend Node.js / Express Metrics
  - job_name: 'backend'
    scrape_interval: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['task_backend:5000']
        labels:
          app: 'task_backend'
          env: 'production'

  # 3. cAdvisor - Container resource monitoring (CPU, RAM, Network)
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['task_cadvisor:8080']
        labels:
          app: 'task_cadvisor'
          env: 'production'

  # 4. Nginx Reverse Proxy (via backend endpoint or proxy metrics)
  - job_name: 'nginx_proxy'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['task_proxy:443']
        labels:
          app: 'task_proxy'
    tls_config:
      insecure_skip_verify: true
