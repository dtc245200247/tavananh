apiVersion: 1

datasources:
  # 1. Prometheus Datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://task_prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s

  # 2. Loki Datasource
  - name: Loki
    type: loki
    access: proxy
    url: http://task_loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
