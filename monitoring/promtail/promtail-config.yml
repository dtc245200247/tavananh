server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://task_loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container json logs
  - job_name: docker_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            tag: attrs.tag
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*\.log$'
          source: filename
      # Map container names or standard labels
      - labels:
          stream:
          container_id:

  # Scrape application system logs / direct container files
  - job_name: task_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
